name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  # Republish when master's TodoMVC run finishes, so the live demo stays current.
  workflow_run:
    workflows: [TodoMVC]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - run: mkdocs build --strict

      # The TodoMVC live demo: the recorded report from master's latest
      # successful TodoMVC run, served at /demo/todomvc/. Best effort: a site
      # without it still deploys, and the docs page says where it comes from.
      - name: Add the TodoMVC live demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow todomvc.yml --branch master \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No successful TodoMVC run on master yet; publishing without the demo."
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name todomvc-report --dir site/demo/todomvc \
            || echo "::warning::TodoMVC run $run_id has no report artifact; publishing without the demo."

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
